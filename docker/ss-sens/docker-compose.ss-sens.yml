# docker-compose.ss-sens.yml
#
# Coop-pilot IoT edge services. Three bundle configurations supported:
#
#   min      -- MQTT hub + LoRaWAN (ChirpStack): sensor data, mechanical control
#   standard -- min + Frigate NVR: adds video surveillance (default)
#   video    -- MQTT hub + Frigate NVR: standalone video, no LoRaWAN
#
# Activated via COMPOSE_PROFILES (comma-separated):
#   lorawan  -- chirpstack-* services (postgres, redis, server, gateway-bridge, rest-api)
#   metrics  -- prometheus, grafana, cAdvisor, node-exporter
#
# mosquitto and the ss-sens FastAPI service always start.
# Frigate lives in the video repository (docker/core profile `frigate`).
#
# Bundle -> profiles mapping:
#   min       COMPOSE_PROFILES=lorawan
#   standard  COMPOSE_PROFILES=lorawan  plus `make frigate-up`
#   video     mosquitto + ss-sens, plus `make frigate-up`
#   + metrics append ,metrics to any of the above
#
# Resource limits are parameterised via COOP_* variables in .data/.env.
# Defaults target the minimum supported spec: 4-core CPU, 8 GB RAM.
# See src/ss_sens/env/prod.env for mid / high profile guidance.
#
# Usage (via scripts):
#   ./scripts/ss-sens/ss-sens-bootstrap.sh      -- first run: .env, certs, users, start
#   ./scripts/ss-sens/ss-sens-compose.sh up -d  -- subsequent starts
#   ss-sens-ctl start                           -- installed stack (reads .env profiles)
#
# Or via Makefile:
#   make ss-sens-up          (lorawan)
#   make ss-sens-down
#   make ss-sens-up-min      (lorawan)
#   make ss-sens-metrics-up  (lorawan + metrics)
# Frigate stays in the video repository (`make frigate-up`).

networks:
  default:
    name: selfsuvis-net

volumes:
  coop_chirpstack_pg_data:
  coop_chirpstack_redis_data:
  coop_grafana_data:

services:

  # ── MQTT Broker ─────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ss-sens-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"      # plain MQTT (internal; restrict at firewall in production)
      - "8883:8883"      # MQTT over TLS (external sensors / Dragino LPS8N)
    volumes:
      - ./config/ss-sens/mosquitto:/mosquitto/config:ro
      - ${DATA_DIR:-./.data}/coop/mosquitto:/mosquitto/secrets:ro
      - ${DATA_DIR:-./.data}/mosquitto/data:/mosquitto/data
      - ${DATA_DIR:-./.data}/mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -u ${MOSQUITTO_HEALTH_USER:-health} -P ${MOSQUITTO_HEALTH_PASSWORD:-health} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${COOP_MOSQUITTO_CPUS:-0.15}"
          memory: ${COOP_MOSQUITTO_MEMORY:-128M}
        reservations:
          cpus: "0.05"
          memory: 32M

  # ── ss-sens sensor mesh service ──────────────────────────────────────────────
  # Subscribes to ChirpStack uplinks, serves /site/sensors and /site/mesh,
  # and publishes contract SensorEvent messages on ss/v1/... topics.
  ss-sens:
    build:
      context: .
      dockerfile: docker/ss-sens/Dockerfile.ss-sens
    container_name: ss-sens
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "${COOP_HTTP_PORT:-8081}:8081"
    environment:
      COOP_MQTT_HOST: mosquitto
      COOP_MQTT_PORT: "1883"
      COOP_MQTT_USER: ${COOP_MQTT_USER:-ss-sens}
      COOP_MQTT_PASSWORD: ${COOP_MQTT_PASSWORD:-}
      COOP_MQTT_TLS: "false"
      COOP_SITE_ID: ${COOP_SITE_ID:-local}
      COOP_CHIRPSTACK_TOPIC: ${COOP_CHIRPSTACK_TOPIC:-application/+/device/+/event/up}
      COOP_SENSOR_WINDOW_SEC: ${COOP_SENSOR_WINDOW_SEC:-300}
      COOP_HTTP_HOST: "0.0.0.0"
      COOP_HTTP_PORT: "8081"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${COOP_SS_SENS_CPUS:-0.25}"
          memory: ${COOP_SS_SENS_MEMORY:-256M}
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── ChirpStack LoRaWAN Network Server ────────────────────────────────────────
  # Active when COMPOSE_PROFILES contains 'lorawan' (bundle: min, standard)
  chirpstack-postgres:
    image: postgres:14-alpine
    container_name: ss-sens-cs-postgres
    restart: unless-stopped
    profiles:
      - lorawan
    environment:
      POSTGRES_USER: ${CHIRPSTACK_PG_USER:-chirpstack}
      POSTGRES_PASSWORD: ${CHIRPSTACK_PG_PASSWORD:-chirpstack}
      POSTGRES_DB: ${CHIRPSTACK_PG_DB:-chirpstack}
    volumes:
      - coop_chirpstack_pg_data:/var/lib/postgresql/data
      - ./config/ss-sens/postgresql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CHIRPSTACK_PG_USER:-chirpstack}"]
      interval: 20s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${COOP_CS_POSTGRES_CPUS:-0.50}"
          memory: ${COOP_CS_POSTGRES_MEMORY:-512M}
        reservations:
          cpus: "0.10"
          memory: 128M

  chirpstack-redis:
    image: redis:7-alpine
    container_name: ss-sens-cs-redis
    restart: unless-stopped
    profiles:
      - lorawan
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - coop_chirpstack_redis_data:/data
      - ./config/ss-sens/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "${COOP_CS_REDIS_CPUS:-0.10}"
          memory: ${COOP_CS_REDIS_MEMORY:-96M}
        reservations:
          cpus: "0.05"
          memory: 32M

  chirpstack:
    image: chirpstack/chirpstack:4
    container_name: ss-sens-chirpstack
    restart: unless-stopped
    profiles:
      - lorawan
    command: --config /etc/chirpstack
    depends_on:
      chirpstack-postgres:
        condition: service_healthy
      chirpstack-redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"    # ChirpStack UI + gRPC API
    volumes:
      - ./config/ss-sens/chirpstack:/etc/chirpstack:ro
    environment:
      POSTGRESQL_HOST: chirpstack-postgres
      REDIS_HOST: chirpstack-redis
      MQTT_BROKER_HOST: mosquitto
      CHIRPSTACK_PG_USER: ${CHIRPSTACK_PG_USER:-chirpstack}
      CHIRPSTACK_PG_PASSWORD: ${CHIRPSTACK_PG_PASSWORD:-chirpstack}
      CHIRPSTACK_PG_DB: ${CHIRPSTACK_PG_DB:-chirpstack}
      CHIRPSTACK_MQTT_USERNAME: ${CHIRPSTACK_MQTT_USERNAME:-chirpstack}
      CHIRPSTACK_MQTT_PASSWORD: ${CHIRPSTACK_MQTT_PASSWORD:-chirpstack}
      CHIRPSTACK_API_SECRET: ${CHIRPSTACK_API_SECRET:-change_me}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "${COOP_CHIRPSTACK_CPUS:-0.50}"
          memory: ${COOP_CHIRPSTACK_MEMORY:-512M}
        reservations:
          cpus: "0.10"
          memory: 128M

  # Semtech UDP packet forwarder bridge.
  # Point the gateway "Server Address" to this host's IP in the gateway web UI.
  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    container_name: ss-sens-cs-gwbridge
    restart: unless-stopped
    profiles:
      - lorawan
    depends_on:
      mosquitto:
        condition: service_healthy
    ports:
      - "1700:1700/udp"    # Semtech UDP packet forwarder (EU868 gateways)
    environment:
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: "eu868/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: "eu868/gateway/{{ .GatewayID }}/command/#"
      INTEGRATION__MQTT__AUTH__GENERIC__SERVER: "tcp://mosquitto:1883"
      INTEGRATION__MQTT__AUTH__GENERIC__USERNAME: ${CHIRPSTACK_GWBRIDGE_MQTT_USERNAME:-chirpstack_gw}
      INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD: ${CHIRPSTACK_GWBRIDGE_MQTT_PASSWORD:-chirpstack_gw}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${COOP_CS_GWBRIDGE_CPUS:-0.10}"
          memory: ${COOP_CS_GWBRIDGE_MEMORY:-64M}
        reservations:
          cpus: "0.05"
          memory: 16M

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    container_name: ss-sens-cs-rest
    restart: unless-stopped
    profiles:
      - lorawan
    depends_on:
      - chirpstack
    ports:
      - "127.0.0.1:8090:8090"
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "${COOP_CS_REST_CPUS:-0.10}"
          memory: ${COOP_CS_REST_MEMORY:-64M}
        reservations:
          cpus: "0.05"
          memory: 16M

  # Frigate NVR moved to docker/core/docker-compose.yml (profile `frigate`).

  # ── Prometheus (optional) ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ss-sens-prometheus
    restart: unless-stopped
    profiles:
      - metrics
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/ss-sens/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_DIR:-./.data}/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${COOP_PROMETHEUS_CPUS:-0.25}"
          memory: ${COOP_PROMETHEUS_MEMORY:-256M}
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── Grafana (optional) ─────────────────────────────────────────────────────
  # Dashboard UI. Access at http://127.0.0.1:3000 (admin / GRAFANA_ADMIN_PASSWORD).
  grafana:
    image: grafana/grafana:11-alpine
    container_name: ss-sens-grafana
    restart: unless-stopped
    profiles:
      - metrics
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config/ss-sens/grafana/provisioning:/etc/grafana/provisioning:ro
      - coop_grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "http://127.0.0.1:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "${COOP_GRAFANA_CPUS:-0.25}"
          memory: ${COOP_GRAFANA_MEMORY:-256M}
        reservations:
          cpus: "0.05"
          memory: 64M

  # ── cAdvisor (optional) ────────────────────────────────────────────────────
  # Per-container CPU / memory / network metrics scraped by Prometheus.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ss-sens-cadvisor
    restart: unless-stopped
    profiles:
      - metrics
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "${COOP_CADVISOR_CPUS:-0.15}"
          memory: ${COOP_CADVISOR_MEMORY:-128M}
        reservations:
          cpus: "0.05"
          memory: 32M

  # ── Node Exporter (optional) ───────────────────────────────────────────────
  # Host-level CPU / memory / disk / network metrics. Runs on host network.
  node-exporter:
    image: prom/node-exporter:latest
    container_name: ss-sens-node-exporter
    restart: unless-stopped
    profiles:
      - metrics
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "${COOP_NODE_EXPORTER_CPUS:-0.05}"
          memory: ${COOP_NODE_EXPORTER_MEMORY:-32M}
        reservations:
          cpus: "0.02"
          memory: 8M
